worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ---------------------------
    # Required for Headscale WebSocket
    # Must be at http level
    # ---------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Astral Kings: its sockets carry the login token in the URL (/ws/game?token=...) — log paths
    # without the query string (the game's own nginx does the same; README "Behind another proxy").
    map $request_uri $request_path {
        ~^(?<path>[^?]*) $path;
    }
    log_format combined_no_query '$remote_addr - $remote_user [$time_local] "$request_method $request_path $server_protocol" '
                                 '$status $body_bytes_sent "$http_referer" "$http_user_agent"';


    # Optional: redirect HTTP to HTTPS after cert is issued
    server {
        listen 80;
        server_name immich.aidensrocks.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------
    # Immich HTTPS site
    # ---------------------------
    server {
        listen 443 ssl http2;
        server_name immich.aidensrocks.com;
        client_max_body_size 500M;

        ssl_certificate     /etc/immich/certs/immich.aidensrocks.com/cloudflare_origin.pem;
        ssl_certificate_key /etc/immich/private/immich.aidensrocks.com/cloudflare_origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://192.168.1.70:2283;

            # WebSocket & SSE Support (this is what was missing)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Forward standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Turn off buffering (important for Immich streaming)
            proxy_request_buffering off;
            proxy_buffering off;

            # Optional: improve reliability
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            send_timeout 3600s;
        }
    }

    # ---------------------------
    # Redirect all HTTP to HTTPS
    # ---------------------------
    server {
        listen 80;
        server_name aidensrocks.com www.aidensrocks.com nas.aidensrocks.com studiomanager.aidensrocks.com studiomanager-mp.aidensrocks.com bockmedia.aidensrocks.com ha.aidensrocks.com ak.aidensrocks.com;
        return 301 https://$host$request_uri;
    }

    # ---------------------------
    # Main HTTPS site
    # ---------------------------
    server {
        listen 443 ssl http2;
        server_name aidensrocks.com www.aidensrocks.com;
        client_max_body_size 500M;

        # The site is proxied through Cloudflare, so without this every
        # request looked like it came from a Cloudflare server: the API's
        # per-visitor rate limits were shared by everyone behind the same
        # Cloudflare location, and the IP lookup found no location.
        # Take the visitor's address from CF-Connecting-IP, but only when the
        # request really comes from Cloudflare (anyone else could fake the
        # header). $remote_addr -- and so X-Real-IP / X-Forwarded-For below --
        # then holds the visitor. Ranges from https://www.cloudflare.com/ips/
        # (checked 2026-10-16; re-check about once a year).
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;
        real_ip_header CF-Connecting-IP;

        ssl_certificate     /etc/ssl/certs/cloudflare_origin.pem;
        ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        # Source maps are private (admin stack traces only). The build already
        # moves them out of the web root; this is the safety net.
        location ~* \.map$ {
            return 404;
        }

        # Frontend static files
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Backend API
        location /api/ {
            proxy_pass http://server:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-cache, no-store, must-revalidate";

            # Long enough for large video uploads
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            send_timeout 600s;
        }

        # Media files
        location /media/ {
            proxy_pass http://server:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---------------------------
    # Headscale / Fileshare HTTPS site
    # ---------------------------
    server {
        listen 443 ssl http2;
        server_name nas.aidensrocks.com;

        ssl_certificate     /etc/ssl/certs/cloudflare_origin.pem;
        ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Optional: basic auth
        # auth_basic "Restricted";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://192.168.1.72:8080;
            proxy_http_version 1.1;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeouts
            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            send_timeout          300s;
        }
    }

	# ---------------------------
    # Studio Manager HTTPS site
    # ---------------------------
    server {
        listen 443 ssl http2;
        server_name studiomanager.aidensrocks.com;
        client_max_body_size 15M;
        ssl_certificate     /etc/ssl/certs/cloudflare_origin.pem;
        ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /minio/ {
            proxy_pass http://192.168.1.75:9000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://192.168.1.75:80;
            proxy_http_version 1.1;
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Timeouts
            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            send_timeout          300s;
        }
    }

    # ---------------------------
    # Mailpit (UAT email viewer)
    # ---------------------------
    server {
        listen 443 ssl http2;
        server_name studiomanager-mp.aidensrocks.com;

        ssl_certificate     /etc/ssl/certs/cloudflare_origin.pem;
        ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://192.168.1.75:8025;
            proxy_http_version 1.1;

            # WebSocket support (Mailpit uses it for live inbox updates)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
	
	  # ---------------------------
    # Bock Media HTTPS site
    # ---------------------------
    server {
        listen 443 ssl http2;
        server_name bockmedia.aidensrocks.com;

        # Utilizing your wildcard Cloudflare origin certs
        ssl_certificate     /etc/ssl/certs/cloudflare_origin.pem;
        ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://192.168.1.76:3001;
            proxy_http_version 1.1;

            # WebSocket and Connection upgrade support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Prevent buffering to avoid breaking real-time audio streams
            proxy_request_buffering off;
            proxy_buffering off;

            # High timeouts for long-lived Alexa connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            send_timeout 3600s;
        }
    }	

    # ---------------------------
    # Home Assistant HTTPS site
    # ---------------------------
    server {
        listen 443 ssl http2;
        server_name ha.aidensrocks.com;

        ssl_certificate     /etc/ssl/certs/cloudflare_origin.pem;
        ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://192.168.1.77:8123;
            proxy_http_version 1.1;

            # WebSocket support - Mandatory for Home Assistant
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            send_timeout 3600s;
        }
    }

    # ---------------------------
    # Astral Kings HTTPS site
    # ---------------------------
    # Forwards everything to the game's own nginx (HTTP_PORT in its .env), which splits
    # /api/, /ws/ and the client itself. Set APP_URL=https://ak.aidensrocks.com in the game's .env.
    server {
        listen 443 ssl http2;
        server_name ak.aidensrocks.com;
        access_log /var/log/nginx/access.log combined_no_query;

        ssl_certificate     /etc/ssl/certs/cloudflare_origin.pem;
        ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://192.168.1.80:80;
            proxy_http_version 1.1;

            # WebSocket support - the game runs on two WebSockets (/ws/hub, /ws/game)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # A game socket can sit quiet between turns (the server pings every 25 s)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            send_timeout 3600s;
        }
    }
}
