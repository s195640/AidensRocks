services:
  postgres:
    container_name: database
    env_file: .env
    ports:
      - "${DB_PORT}:${DB_PORT}"
    image: postgres:17
    volumes:
      - volume-sql:/var/lib/postgresql/data
      - volume-sql-backup:/backup
    healthcheck:
      test: [ 'CMD-SHELL', "sh -c 'pg_isready -U $DB_USER -d ${DB_NAME}'" ]
      interval: 5s
      timeout: 60s
      retries: 5
      start_period: 80s
    networks:
      - app-network
  server:
    container_name: server
    build:
      context: ../../
      dockerfile: ./data/docker/docker-server-dev
    env_file: .env
    volumes:
      - ../../server:/app
      - /app/node_modules
      - volume-media:/app/media
      - ../../VERSION:/app/VERSION:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app-network
  mailpit:
    container_name: mailpit
    image: axllent/mailpit:latest
    ports:
      - '8025:8025' # web UI — view caught dev emails at http://localhost:8025
      - '1025:1025' # SMTP
    networks:
      - app-network
  client:
    container_name: client
    build:
      context: ../../
      dockerfile: ./data/docker/docker-client-dev
      secrets:
        - github_token
    volumes:
      - ../../client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - app-network
  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../nginx/nginxTEST.conf:/etc/nginx/nginx.conf
    depends_on:
      - client
      - server
    networks:
      - app-network
  pg_backup:
    container_name: pg_backup
    image: alpine:latest
    command: sh -c " apk update && apk add --no-cache postgresql-client && \ echo '*/5 * * * * PGPASSWORD=$DB_PASSWORD pg_dump -h $DB_HOST -p $DB_PORT -U $DB_USER $DB_NAME > /backup/${DB_NAME}_backup_$(date +\%F_\%H-\%M).sql' > /etc/crontabs/root && \ crond -f -l 2 "
    volumes:
      - volume-sql-backup:/backup
    networks:
      - app-network
volumes:
  volume-media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../test_instance/media
  volume-sql:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../test_instance/sql
  volume-sql-backup:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../test_instance/sql_backup
networks:
  app-network:
    driver: bridge

# See docker-compose-prod.yml's own comment: sourced from a plain-text
# `github_token` file in this directory (gitignored), reaches only the
# client build's BuildKit secret mount — never an image layer or container
# env var.
secrets:
  github_token:
    file: ./github_token
